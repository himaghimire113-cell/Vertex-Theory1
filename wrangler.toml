name = "vertex-theory1"
main = "worker.ts"
compatibility_date = "2024-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = false
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
